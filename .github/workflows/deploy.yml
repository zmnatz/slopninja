name: Deploy

# Production and PR previews both publish to the gh-pages branch, so GitHub Pages
# must be set to serve that branch. Production goes to the root; each PR goes to
# pr-preview/pr-<number>/ and is removed when the PR closes.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# One publisher at a time, so pushes to gh-pages never race.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  test:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # The Storybook tests run the stories in a real browser.
      - run: bunx playwright install --with-deps chromium
      - run: bun run test

  production:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile && bun run build
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean-exclude: pr-preview/

  preview:
    # Fork PRs get a read-only token, so they cannot publish a preview.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile && bun run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}/
          VITE_PREVIEW: "true"
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: dist

  # Closing a PR skips the tests, so the preview cleanup runs on its own.
  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: dist
          action: remove
